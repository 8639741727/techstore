<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://assets.adobedtm.com/83206ba1ed8f/a1f0eb867634/launch-e350af4a2689-development.min.js" async></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TechStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header>
    <div class="logo">
        <h1>TechStore</h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li>
              <a href="cart.html">
                  Cart (<span id="cart-count">0</span>)
              </a>
          </li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<!-- Checkout Section -->
<section class="checkout-section">

    <div class="checkout-box">

        <h2>Shipping Address</h2>

        <form>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter email">
            </div>

            <div class="input-group">
                <label>Address</label>
                <input type="text" placeholder="Street address">
            </div>

            <div class="input-group">
                <label>City</label>
                <input type="text" placeholder="City">
            </div>

            <div class="input-group">
                <label>State</label>
                <input type="text" placeholder="State">
            </div>

            <div class="input-group">
                <label>Zip Code</label>
                <input type="text" placeholder="Zip code">
            </div>

            <h2>Payment Details</h2>

            <div class="input-group">
                <label>Card Holder Name</label>
                <input type="text" placeholder="Card holder name">
            </div>

            <div class="input-group">
                <label>Card Number</label>
                <input type="text" placeholder="XXXX XXXX XXXX XXXX">
            </div>

            <div class="input-group">
                <label>Expiry Date</label>
                <input type="month">
            </div>

            <div class="input-group">
                <label>CVV</label>
                <input type="password" placeholder="CVV">
            </div>

            <button class="place-order-btn">
                Place Order
            </button>

        </form>

    </div>

</section>

<!-- Footer -->
<footer>

    <div>
        <h3>TechStore</h3>
        <p>Your one-stop electronics store.</p>
    </div>

    <div>
        <h3>Quick Links</h3>
        <p>Home</p>
        <p>Products</p>
        <p>Contact</p>
    </div>

    <div>
        <h3>Contact</h3>
        <p>support@techstore.com</p>
        <p>+91 9876543210</p>
    </div>

</footer>
<script src="script.js"></script>
</body>
</html>
